   #include <stdio.h>
#include <stdlib.h>
#define MAX 5

int stack[MAX];
int top = -1;

void push()
{
    int value;

    if (top == MAX - 1)
    {
        printf("\nStack Overflow! Cannot push element.\n");
        return;
    }

    printf("Enter the element to push: ");
    scanf("%d", &value);

    top++;
    stack[top] = value;

    printf("%d pushed onto the stack.\n", value);
}

void pop()
{
    if (top == -1)
    {
        printf("\nStack Underflow! Stack is empty.\n");
        return;
    }

    printf("%d popped from the stack.\n", stack[top]);
    top--;
}

void palindrome()
{
    int n, i;
    int temp[MAX];
    int t = -1;
    int flag = 1;

    printf("\nEnter the number of elements (maximum %d): ", MAX);
    scanf("%d", &n);

    if (n <= 0 || n > MAX)
    {
        printf("Invalid size!\n");
        return;
    }

    printf("Enter %d elements:\n", n);

    for (i = 0; i < n; i++)
    {
        scanf("%d", &temp[i]);
        t++;
        stack[t] = temp[i];
    }

    for (i = 0; i < n; i++)
    {
        if (temp[i] != stack[t])
        {
            flag = 0;
            break;
        }
        t--;
    }

    if (flag == 1)
        printf("The given sequence is a PALINDROME.\n");
    else
        printf("The given sequence is NOT a PALINDROME.\n");

    top = -1;
}

void display()
{
    int i;

    if (top == -1)
    {
        printf("\nStack is empty.\n");
        return;
    }

    printf("\nStack elements are:\n");

    for (i = top; i >= 0; i--)
    {
        printf("%d\n", stack[i]);
    }
}

int main()
{
    int choice;

    while (1)
    {
        printf("\n========== STACK MENU ==========\n");
        printf("1. Push an element\n");
        printf("2. Pop an element\n");
        printf("3. Check Palindrome\n");
        printf("4. Display Stack\n");
        printf("5. Exit\n");
        printf("================================\n");

        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice)
        {
            case 1:
                push();
                break;

            case 2:
                pop();
                break;

            case 3:
                palindrome();
                break;

            case 4:
                display();
                break;

            case 5:
                printf("\nExiting program...\n");
                exit(0);

            default:
                printf("\nInvalid choice! Please try again.\n");
        }
    }

    return 0;
}

  <script>
    function copyCode() {
      var box = document.getElementById('codeBox');
      var msg = document.getElementById('copyMsg');
      var text = box.value;

      function showSuccess() {
        msg.classList.add('visible');
        setTimeout(function () {
          msg.classList.remove('visible');
        }, 2000);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showSuccess).catch(function () {
          fallbackCopy(box, showSuccess);
        });
      } else {
        fallbackCopy(box, showSuccess);
      }
    }

    function fallbackCopy(box, onSuccess) {
      box.focus();
      box.select();
      try {
        document.execCommand('copy');
        onSuccess();
      } catch (e) {
        alert('Copy failed. Please select all and copy manually.');
      }
    }

    function selectAllCode() {
      var box = document.getElementById('codeBox');
      box.focus();
      box.select();
    }
  </script>
