<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a Subject - My Programs Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="hero-glow"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <span class="header-label">My Programs Library</span>
    </div>
  </header>

  <main class="home-main">
    <section class="hero">
      <h1 class="hero-title">MY PROGRAMS LIBRARY</h1>
      <p class="hero-subtitle">Choose a subject to get started</p>
    </section>

    <section class="cards-grid subject-grid">
      <a href="java.html" class="program-card" data-num="01">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <span class="card-number">01</span>
        <span class="card-title">JAVA</span>
        <span class="card-hint">Open &rarr;</span>
      </a>

      <a href="index.html" class="program-card" data-num="02">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="6" r="2"></circle>
            <circle cx="19" cy="6" r="2"></circle>
            <circle cx="12" cy="18" r="2"></circle>
            <line x1="6.5" y1="7.5" x2="10.5" y2="16.5"></line>
            <line x1="17.5" y1="7.5" x2="13.5" y2="16.5"></line>
          </svg>
        </div>
        <span class="card-number">02</span>
        <span class="card-title">DATA STRUCTURE</span>
        <span class="card-hint">Open &rarr;</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>My Programs Library &mdash; Edit, Copy &amp; Run</p>
  </footer>
</body>
</html>
