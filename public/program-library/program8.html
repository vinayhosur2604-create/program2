      <textarea class="editor-textarea" id="codeBox" spellcheck="false">#include <stdio.h>
#include <stdlib.h>

struct node
{
    int data;
    struct node *left, *right;
};

struct node* createNode(int value)
{
    struct node *newNode;

    newNode = (struct node*)malloc(sizeof(struct node));

    newNode->data = value;
    newNode->left = NULL;
    newNode->right = NULL;

    return newNode;
}

struct node* insert(struct node *root, int value)
{
    if(root == NULL)
        return createNode(value);

    if(value < root->data)
        root->left = insert(root->left, value);

    else if(value > root->data)
        root->right = insert(root->right, value);

    return root;
}

void inorder(struct node *root)
{
    if(root != NULL)
    {
        inorder(root->left);
        printf("%d ", root->data);
        inorder(root->right);
    }
}

void preorder(struct node *root)
{
    if(root != NULL)
    {
        printf("%d ", root->data);
        preorder(root->left);
        preorder(root->right);
    }
}

void postorder(struct node *root)
{
    if(root != NULL)
    {
        postorder(root->left);
        postorder(root->right);
        printf("%d ", root->data);
    }
}

void search(struct node *root, int key)
{
    if(root == NULL)
    {
        printf("Element not found in BST\n");
        return;
    }

    if(key == root->data)
    {
        printf("Element found in BST\n");
    }
    else if(key < root->data)
    {
        search(root->left, key);
    }
    else
    {
        search(root->right, key);
    }
}

int main()
{
    struct node *root = NULL;
    int a[] = {6, 9, 5, 2, 8, 15, 24, 14, 7, 8};
    int i, choice, key, n = 10;

    for(i = 0; i < n; i++)
    {
        root = insert(root, a[i]);
    }

    printf("BST Created Successfully\n");

    while(1)
    {
        printf("\n\n--- BST MENU ---\n");
        printf("1. Inorder Traversal\n");
        printf("2. Preorder Traversal\n");
        printf("3. Postorder Traversal\n");
        printf("4. Search an Element\n");
        printf("5. Exit\n");

        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch(choice)
        {
            case 1:
                printf("Inorder Traversal: ");
                inorder(root);
                break;

            case 2:
                printf("Preorder Traversal: ");
                preorder(root);
                break;

            case 3:
                printf("Postorder Traversal: ");
                postorder(root);
                break;

            case 4:
                printf("Enter the KEY to search: ");
                scanf("%d", &key);
                search(root, key);
                break;

            case 5:
                printf("Exiting the program...\n");
                exit(0);

            default:
                printf("Invalid Choice!\n");
        }
    }

    return 0;
}

  <script>
    function copyCode() {
      var box = document.getElementById('codeBox');
      var msg = document.getElementById('copyMsg');
      var text = box.value;

      function showSuccess() {
        msg.classList.add('visible');
        setTimeout(function () {
          msg.classList.remove('visible');
        }, 2000);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showSuccess).catch(function () {
          fallbackCopy(box, showSuccess);
        });
      } else {
        fallbackCopy(box, showSuccess);
      }
    }

    function fallbackCopy(box, onSuccess) {
      box.focus();
      box.select();
      try {
        document.execCommand('copy');
        onSuccess();
      } catch (e) {
        alert('Copy failed. Please select all and copy manually.');
      }
    }

    function selectAllCode() {
      var box = document.getElementById('codeBox');
      box.focus();
      box.select();
    }
  </script>
